[pytest]
addopts = -vs -rf --alluredir=reports/allure-results
markers =
    HealthCheck: Marker for health check test
    VATDTAI: VAT DTAI application tests
    MVP: Minimum Viable Product features
    UIUX: UI/UX related tests
    UI_UX: UI/UX related tests (alias)
    UI: UI related tests
    UM: User Management module tests
    DI: Data Ingestion module tests
    DataIngestion: Data Ingestion functionality tests
    VATTile: VAT Tile module tests
    P1: Priority 1 tests
    P2: Priority 2 tests
    P3: Priority 3 tests
    UserStory_595077: User Story 595077 - Data Ingestion
    Failed: Known failing tests (excluded from main runs)
    Hardcoded: Tests using hardcoded data
    ModuleAccess: Module access verification tests
    Admin: Admin user role tests
    CountryOwner: Country Owner role tests
    DefaultSort: Default sorting tests
    ExistingUsers: Existing Users table tests
    Sorting: Sorting functionality tests
    Filtering: Filtering functionality tests
    Filters: Filter functionality tests (alias)
    Search: Search functionality tests
    SelectAll: Select all checkbox tests
    ClearFilters: Clear filters button tests
    ResetSort: Reset sort button tests
    Download: Download functionality tests
    Pagination: Pagination tests
    Scroll: Scroll functionality tests
    FileUpload: File upload functionality tests
    BatchProcessing: Batch processing tests
    APIDetails: API Details table tests
    BatcheInvoices: Batch e-Invoices table tests
    InvalidFormat: Invalid file format tests
    InvalidData: Invalid data tests
    AccessControl: Access control tests
    Authorization: Authorization tests
    Sections: Section display tests
    TableDisplay: Table display tests
    Delete: Delete functionality tests
    AuditTrail: Audit trail tests
    Navigation: Navigation functionality tests
    Dashboard: Dashboard display tests
    TileLaunch: Tile launch tests
    TC_607973: Test case ID 607973
    TC_607974: Test case ID 607974
    TC_607975: Test case ID 607975
    TC_607976: Test case ID 607976
    TC_607977: Test case ID 607977
    TC_607978: Test case ID 607978
    TC_607979: Test case ID 607979
    TC_607980: Test case ID 607980
    TC_607981: Test case ID 607981
    TC_607982: Test case ID 607982
    TC_607983: Test case ID 607983
    TC_604817: Test case ID 604817
    TC_604820: Test case ID 604820
    TC_604822: Test case ID 604822
    TC_604827: Test case ID 604827
    TC_604828: Test case ID 604828
    TC_604829: Test case ID 604829
    TC_604830: Test case ID 604830
    TC_604831: Test case ID 604831
    TC_604838: Test case ID 604838
    TC_604840: Test case ID 604840
