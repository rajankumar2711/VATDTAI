    TC_604843: Test case ID 604843
    TC_608001: Test case ID 608001
    TC_608002: Test case ID 608002
    TC_608003: Test case ID 608003
    TC_604823: Test case ID 604823 - Invalid file format upload
    TC_604824: Test case ID 604824 - Invalid data upload
    VAT_DTAI_Smoke: VAT DTAI smoke suite scenarios
    IM: e-Invoice Management module tests
    AgentE2E: e-Invoice validation agent end-to-end flow (ingest -> agent -> Review Required)
    Client_Belgium: Run scenario against Client Belgium workspace
    Client_France: Run scenario against Client France workspace
    Client_Poland: Run scenario against Client Poland workspace
    TC_AGENT_BE: Agent E2E - Belgium
    TC_AGENT_FR: Agent E2E - France
    TC_AGENT_PL: Agent E2E - Poland
    AgentAction: e-Invoice agent Accept/Reject AI suggestion actions
    TC_AGENT_ACCEPT_ALL: Agent action - Accept all AI suggestions -> Reviewed
    TC_AGENT_REJECT_ALL: Agent action - Reject all AI suggestions -> Reviewed
    TC_AGENT_ACCEPT_ONE: Agent action - Accept one suggestion disables it
    TC_AGENT_REJECT_ONE: Agent action - Reject one suggestion disables it
testpaths = tests step_defs
python_files = test_*.py

[pytest-html-reporter]
output = reports/pytest_html_report.html
open = False
showEnvironment = True
showDashboard = True
showSummary = True
showTestCase = True
showLog = True